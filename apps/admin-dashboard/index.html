<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المنصة</title><link rel="stylesheet" href="../web/styles.css"></head>
<body><main><header><strong>إدارة المنصة</strong><a href="../web/index.html">الرئيسية</a></header>
<section class="panel"><h1>الجامعات والتدقيق</h1><p id="guard">...</p><div id="tenants" class="grid"></div><h2>آخر سجلات التدقيق</h2><div id="audit">...</div></section>
<script>
const API='/api/v1',token=localStorage.getItem('university_access_token')||'',tenant=localStorage.getItem('university_tenant_id')||'demo',H={Authorization:'Bearer '+token,'X-Tenant-ID':tenant};
async function run(){if(!token){guard.textContent='يلزم تسجيل دخول مسؤول المنصة.';return;}const t=await fetch(API+'/tenants/',{headers:H}),td=await t.json();if(!t.ok){guard.textContent=td.detail||'غير مصرح';return;}guard.textContent='المستخدم مصرح لإدارة المستأجرين.';tenants.innerHTML=td.map(x=>'<article><b>'+x.name+'</b><p>'+x.slug+' — '+x.plan+' — '+x.status+'</p></article>').join('');const a=await fetch(API+'/audit/logs',{headers:H}),ad=await a.json();audit.innerHTML=(Array.isArray(ad)?ad:[]).map(x=>'<p>'+x.timestamp+' — '+x.action+' — '+x.status+'</p>').join('')||'لا توجد سجلات.';}run();
</script></main></body></html>
