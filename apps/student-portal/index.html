<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بوابة الطالب</title><link rel="stylesheet" href="../web/styles.css"></head><body><main><h1>بوابة الطالب</h1><p>المقررات والحضور والمشاريع والمساعد الذكي تظهر حسب حالة الطالب وسياسة الجامعة.</p><div class="grid"><article><b>المقررات</b><p>الوصول إلى المواد المنشورة.</p></article><article><b>الحضور</b><p>متابعة الحضور والغياب.</p></article><article><b>المشاريع</b><p>إنشاء وعرض المشاريع.</p></article><article><b>المساعد الذكي</b><p>متاح للطلاب النشطين وفق السياسة.</p></article></div></main></body></html>
