name: University verification

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-runtime:
    name: API runtime and integration verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/api/requirements.txt

      - name: Install dependencies
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile application
        run: python -m compileall -q services/api/app

      - name: Run API test suite
        env:
          PYTHONPATH: services/api
        run: pytest -q services/api/tests

      - name: Build API image
        run: docker build -t university-api-verification -f services/api/Dockerfile services/api

      - name: Start API container
        run: |
          docker run -d --rm --name university-api-verification -p 8000:8000 \
            -e JWT_SECRET=ci_verification_secret \
            university-api-verification

      - name: Verify live HTTP health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs university-api-verification
          exit 1

      - name: Verify tenant-protected route over HTTP
        run: |
          code=$(curl -sS -o /tmp/tenant.json -w "%{http_code}" http://127.0.0.1:8000/api/v1/academics/courses)
          test "$code" = "400"
          grep -q "Tenant identification missing" /tmp/tenant.json

      - name: Verify authenticated tenant route over HTTP
        run: |
          curl -fsS -H "X-Tenant-ID: test-university" \
            http://127.0.0.1:8000/api/v1/academics/courses | grep -q "SWE-432"

  physical-device-preflight:
    name: Physical device evidence gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect an Android application target
        id: detect
        shell: bash
        run: |
          if find . -maxdepth 4 -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | grep -q . \
             && find . -maxdepth 5 -type f \( -name 'AndroidManifest.xml' \) | grep -q .; then
            echo "android_target=true" >> "$GITHUB_OUTPUT"
            echo "Android application target detected."
          else
            echo "android_target=false" >> "$GITHUB_OUTPUT"
            echo "No Android application target exists in this repository."
          fi

      - name: Record device-evidence status
        env:
          ANDROID_TARGET: ${{ steps.detect.outputs.android_target }}
        run: |
          {
            echo "physical_device_evidence:"
            echo "  status: BLOCKED"
            echo "  reason: no Android application target is present in the repository."
            echo "  build_success_is_not_device_success: true"
            echo "  emulator_success_is_not_device_success: true"
            echo "  required_next_evidence: a successful Firebase Test Lab Physical device run or equivalent physical-device report."
            echo "  android_target_detected: ${ANDROID_TARGET}"
          } | tee physical-device-status.txt

      - name: Upload physical-device status
        uses: actions/upload-artifact@v4
        with:
          name: physical-device-status
          path: physical-device-status.txt
